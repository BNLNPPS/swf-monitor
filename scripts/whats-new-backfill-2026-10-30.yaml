- title: Failing production tasks pause themselves and say why
  summary: >-
    A production task whose recent attempts keep failing across several hosts is paused automatically, and the pause says why ("last 50 attempts failed, on 7 hosts"). Resuming stays an operator action; a resume or a Move starts a fresh count.
  details: >-
    The guard pauses at 50 or more completed attempts with 95% or more failed; running jobs finish. Since 28 October every pause, by the guard or a feeder, states its reason.
  tags: [users, ops, pcs]
  importance: high
  shipped: 2026-10-23
  contact: wenaus
  refs:
    - "[CONTINUOUS_PRODUCTION.md, Task failure guard](https://github.com/BNLNPPS/swf-epicprod/blob/main/docs/CONTINUOUS_PRODUCTION.md#task-failure-guard-23-october-2026)"
  evidence: >-
    CONTINUOUS_PRODUCTION.md, Task failure guard (23 October 2026); commits "Every pause carries its reason" (2026-10-28) and "Task failure guard: a verified Move starts a fresh sample" (2026-10-29)

