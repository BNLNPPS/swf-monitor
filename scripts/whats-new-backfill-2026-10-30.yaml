- title: Idle queues take unstarted work automatically
  summary: >-
    The pressure front moves a task whose work has not started from a backed-up queue to an idle one that can run it, never to a queue failing 20% or more. A task that has run stays where it runs.
  tags: [ops, pcs]
  importance: routine
  shipped: 2026-10-26
  contact: wenaus
  refs:
    - "[CONTINUOUS_PRODUCTION.md](https://github.com/BNLNPPS/swf-epicprod/blob/main/docs/CONTINUOUS_PRODUCTION.md)"
  evidence: >-
    swf-epicprod commits "Move unstarted tasks to an idle production queue automatically" and "Idle-queue move: no move to a queue failing 20% or more" (2026-10-26); 10/30 meeting report

- title: Event Service production on Google Cloud and Perlmutter
  summary: >-
    Google Cloud's Event Service queue went to production on 25 October and Perlmutter's on 26 October. Each job takes a whole node; simulation stays resident in each slot and reconstruction is shared across the node.
  details: >-
    Event Service work goes only to these whole-node queues, and they take no other work. Work before those dates and later trials stay out of the production metrics.
  tags: [users, ops, panda]
  importance: high
  shipped: 2026-10-25
  contact: wenaus
  refs:
    - "[NERSC_PERLMUTTER.md](https://github.com/BNLNPPS/swf-epicprod/blob/main/docs/NERSC_PERLMUTTER.md)"
    - "[GKE_PILOT_FLOW.md](https://github.com/BNLNPPS/swf-epicprod/blob/main/docs/GKE_PILOT_FLOW.md)"
