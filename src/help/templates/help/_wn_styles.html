<style>
.wn-intro { max-width: 60em; }
.wn-tag { display: inline-block; padding: .05em .5em; margin: 0 .25em .2em 0;
          border: 1px solid #4a6a8a; border-radius: 4px; background: #eef3f8;
          color: #1f3550; white-space: nowrap; }
a.wn-tag { text-decoration: none; cursor: pointer; }
a.wn-tag:hover { background: #1f3550; color: #fff; }
.wn-imp { display: inline-block; padding: .05em .5em; border-radius: 4px;
          font-weight: 600; white-space: nowrap; border: 1px solid transparent; }
.wn-imp-urgent { background: #b42318; color: #fff; }
.wn-imp-high { background: #f5a524; color: #1f1300; }
.wn-imp-routine { background: #e3e8ee; color: #1f2933; border-color: #8a9bad; }
.wn-imp-minor { background: #fff; color: #1f2933; border-color: #8a9bad; }
.wn-title { font-weight: 600; font-size: 1.05em; }
.wn-summary { margin-top: .15em; white-space: pre-line; }
.wn-toggle { background: none; border: none; padding: 0 .3em; font-size: 1.1em;

.wn-row.wn-open .wn-toggle { transform: rotate(90deg); }
.wn-more { display: none; margin-top: .6em; padding-top: .5em;
           border-top: 1px solid #c5d0db; max-width: 60em; }
.wn-row.wn-open .wn-more { display: block; }
.wn-more h6, .wn-section h5 { font-weight: 600; margin: .6em 0 .25em; }
.wn-vote { white-space: nowrap; }
.wn-vote button { border: 1px solid #8a9bad; background: #fff; color: #1f2933;

.wn-vote button.wn-mine { background: #1f6feb; color: #fff; border-color: #1f6feb; }
.wn-score { display: inline-block; min-width: 1.6em; text-align: center; font-weight: 600; }
.wn-awaiting { color: #8a4b00; font-weight: 600; }

.wn-form .wn-hint { color: #3d4b5a; }
.wn-form textarea, .wn-form input[type=text] { max-width: 60em; }
.wn-section { max-width: 62em; }
.wn-comment { margin: .5em 0; padding: .5em .75em; background: #f6f8fb;

.wn-comment .wn-meta { color: #3d4b5a; margin-bottom: .2em; }
.wn-proposal { padding: .75em 1em; margin-bottom: .75em; border-radius: 6px; max-width: 62em; }
.wn-error { color: #b42318; font-weight: 600; }
