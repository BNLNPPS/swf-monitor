{% if username %}<span class="wn-vote" data-slug="{{ r.slug }}" data-mine="{{ r.my_vote }}"><button type="button" data-value="1" class="{% if r.my_vote == 1 %}wn-mine{% endif %}" title="Vote up; again to withdraw">&#9650;</button> <span class="wn-score" title="{{ r.votes }} vote{{ r.votes|pluralize }}">{{ r.score }}</span> <button type="button" data-value="-1" class="{% if r.my_vote == -1 %}wn-mine{% endif %}" title="Vote down; again to withdraw">&#9660;</button></span>{% else %}<span class="wn-score" title="{{ r.votes }} vote{{ r.votes|pluralize }}">{{ r.score }}</span>{% endif %}
