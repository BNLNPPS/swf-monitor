{% if username %}<span class="wn-vote" data-slug="{{ r.slug }}" data-mine="{{ r.my_vote }}"><button type="button" data-value="1" class="{% if r.my_vote == 1 %}wn-mine{% endif %}" title="Important to me: vote up; again to withdraw">&#9650; <span class="wn-up">{{ r.up }}</span></button> <button type="button" data-value="-1" class="{% if r.my_vote == -1 %}wn-mine{% endif %}" title="Not important to me: vote down; again to withdraw">&#9660; <span class="wn-down">{{ r.down }}</span></button></span>{% else %}<span class="wn-vote">&#9650; {{ r.up }} &#9660; {{ r.down }}</span>{% endif %}
